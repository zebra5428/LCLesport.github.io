    <!-- PROFILE -->
    <div class="profile-container" id="profileContainer">

        <!-- PAGE HEADER -->
        <div class="profile-page-header">

            <div>
                <h1>Profile</h1>

                <p>
                    Manage your profile and favourite items.
                </p>
            </div>

        </div>


        <!-- PROFILE CARD -->
        <div class="profile-card">

            <!-- USERNAME -->
            <div class="profile-header">

                <div class="profile-avatar" id="profileAvatar">
                    M
                </div>



            </div>


            <!-- PROFILE INFORMATION -->
            <div class="section">

                <h2>Profile Information</h2>

                <div class="info-row">

                    <div class="info-label">
                        Username:
                    </div>

                    <div class="info-value" id="username">
                        -
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Favourite:
                    </div>

                    <div class="info-value">
                        <button class="favourite-btn" onclick="showFavourite()">
                            Favourite players
                        </button>
                        <div id="favouritePlayers" style="display: none;"></div>
                    </div>

                </div>

            </div>


            <!-- LOG OUT -->
            <div class="actions">

                <button class="logout-btn" onclick="logout()">
                    LOG OUT
                </button>

            </div>

        </div>

    </div>


    <script>

        let loginLink = document.getElementById("loginLink");


        // Get logged-in user
        const loggedInUser =
            sessionStorage.getItem("loggedInUser");

        const profileContainer =
            document.getElementById("profileContainer");

        //const notLoggedIn =
            document.getElementById("notLoggedIn");

        const username =
            document.getElementById("username");

        const profileAvatar =
            document.getElementById("profileAvatar");


        // Check login
        if (loggedInUser) {

            // Show user's first letter
            loginLink.textContent =
                loggedInUser.charAt(0).toUpperCase();

            loginLink.classList.add("user-circle");

            username.textContent = loggedInUser;

            // Get first letter
            profileAvatar.textContent =
                loggedInUser.charAt(0).toUpperCase();


        } else {

            // Hide profile
            profileContainer.style.display = "none";

            // Show login message
            notLoggedIn.style.display = "block";

        }


        // Logout
        function logout() {

            const answer =
                window.confirm("Do you want to log out?");

            if (answer) {

                sessionStorage.removeItem("loggedInUser");

                window.location.href =
                    "index.html";
            }
        }




        function showFavourite() {

            const favPlayers = JSON.parse(localStorage.getItem("favPlayers_" + loggedInUser)) || [];

            const container = document.getElementById("favouritePlayers");

            // Show the favourite players
            container.style.display = "block";

            container.innerHTML = "";

            
            // If there are no favourite players
            if (favPlayers.length === 0) {
                container.innerHTML = `
            <div class="text-center text-muted">
                No favourite players yet.
            </div>
        `;
                return;
            }
            favPlayers.forEach(player => {
                container.innerHTML += `
            <div>
                ${player}
            </div>
        `;
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
