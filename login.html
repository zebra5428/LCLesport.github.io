<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Sports Club - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="login.css">
</head>


<body>

    <div class="background">

        <div class="container d-flex justify-content-center align-items-center min-vh-100">

            <div class="login-box">

                <!-- Logo -->
                <img src="esport.jpeg" alt="E-Sports Club Logo" class="logo">

                <!-- Title -->
                <h2 class="login-title">
                    LOGIN
                </h2>



                <!-- Login Form -->
                <form onsubmit="login(event)">


                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Username
                        </label>

                        <input type="text" id="username" class="form-control" placeholder="Username" required>

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <label for="password" class="form-label">
                            Password
                        </label>

                        <div class="password-container">

                            <input type="password" id="password" class="form-control" placeholder="Password" required>

                            <i class="bi bi-eye-slash" id="eye" onclick="showPassword()">
                            </i>

                        </div>

                    </div>


                    <!-- Login -->
                    <button type="submit" class="btn login-btn w-100 mt-2">
                        Login
                    </button>

                </form>


                <!-- Message -->
                <p id="message" class="mt-3"></p>



                <!-- Sign Up -->
                <div class="text-center mt-4">

                    <span>Don't have an account?</span>

                    <a href="signup.html" class="signup">
                        Sign Up
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script>

        function login(event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            let users = JSON.parse(localStorage.getItem("users")) || [];

            let user = users.find(
                user => user.username === username &&
                    user.password === password
            );

            if (user) {
                // Remember logged-in user
                sessionStorage.setItem("loggedInUser", username);
                alert("Login successful!");

                document.cookie =
                    "username=" + username + "; max-age=86400; path=/";

                window.location.href = "home.html";
            } else {
                alert("Invalid username or password!");
            }
        }


        // Show / hide password
        function showPassword() {

            let password =
                document.getElementById("password");

            let eye =
                document.getElementById("eye");


            if (password.type === "password") {

                password.type = "text";

                eye.classList.remove("bi-eye-slash");
                eye.classList.add("bi-eye");

            } else {

                password.type = "password";

                eye.classList.remove("bi-eye");
                eye.classList.add("bi-eye-slash");

            }

        }

    </script>

</body>

</html>
